<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instituto Superior Privado Rei Luhuna | Sistema de Gestão Universitária</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0e27;
            color: white;
            overflow-x: hidden;
        }

        #bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-size: cover;
            background-position: center;
            transition: 1s ease-in-out;
            filter: brightness(0.5);
        }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease-in-out;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .glass:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
        }

        .sidebar {
            width: 280px;
            backdrop-filter: blur(25px);
            min-height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            box-shadow: 2px 0 15px rgba(0, 0, 0, 0.4);
            position: fixed;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            z-index: 50;
            overflow-y: auto;
        }

        .main-container {
            margin-left: 280px;
            width: calc(100% - 280px);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .nav-btn {
            padding: 14px 20px;
            border-radius: 12px;
            transition: all 0.3s ease;
            cursor: pointer;
            text-align: left;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            align-items: center;
            gap: 10px;
            border: none;
            background: none;
            width: 100%;
            margin-bottom: 8px;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            transform: translateX(3px);
        }

        .nav-btn.active {
            background: linear-gradient(90deg, #8b5cf633, #7c3aed33);
            color: #a78bfa;
            border-left: 3px solid #a78bfa;
            padding-left: 17px;
        }

        .fade-in {
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #chatButton {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: linear-gradient(90deg, #a78bfa, #7c3aed);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 15px rgba(167, 139, 250, 0.4);
            transition: all 0.3s ease;
        }

        #chatButton:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(167, 139, 250, 0.6);
        }

        #chatWindow {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 350px;
            max-height: 500px;
            background: rgba(10, 14, 39, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            display: none;
            flex-direction: column;
            z-index: 101;
            overflow: hidden;
        }

        #chatWindow.active {
            display: flex;
        }

        .chat-header {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h3 {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
        }

        .chat-close {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            font-size: 1.2rem;
            transition: color 0.3s ease;
        }

        .chat-close:hover {
            color: white;
        }

        #chatBox {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .chat-input-container {
            padding: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 8px;
        }

        #chatInput {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 12px;
            border-radius: 8px;
            outline: none;
            font-size: 0.9rem;
        }

        #chatInput::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        #chatInput:focus {
            border-color: #a78bfa;
            box-shadow: 0 0 0 2px rgba(167, 139, 250, 0.2);
        }

        .chat-send-btn {
            background: linear-gradient(90deg, #a78bfa, #7c3aed);
            border: none;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .chat-send-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        h1.gradient-title {
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(90deg, #a78bfa, #7c3aed, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            line-height: 1.1;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .form-input,
        .form-textarea,
        .form-select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 12px 15px;
            border-radius: 10px;
            outline: none;
            width: 100%;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .form-input:focus,
        .form-textarea:focus,
        .form-select:focus {
            border-color: #a78bfa;
            box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.2);
        }

        .form-textarea {
            min-height: 100px;
            resize: vertical;
        }

        .btn-primary {
            background: linear-gradient(90deg, #a78bfa, #7c3aed);
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: 700;
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(167, 139, 250, 0.4);
            border: none;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(167, 139, 250, 0.6);
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-active {
            background: rgba(34, 197, 94, 0.2);
            color: #86efac;
        }

        .status-pending {
            background: rgba(251, 146, 60, 0.2);
            color: #fed7aa;
        }

        .status-inactive {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 240px;
                padding: 15px;
            }

            .main-container {
                margin-left: 240px;
                width: calc(100% - 240px);
            }

            .nav-btn {
                padding: 12px 15px;
                font-size: 0.95rem;
            }

            h1.gradient-title {
                font-size: 2.2rem;
            }

            #chatWindow {
                width: calc(100% - 40px);
                max-height: 350px;
            }
        }

        @media (max-width: 640px) {
            .sidebar {
                width: 200px;
                padding: 12px;
            }

            .main-container {
                margin-left: 200px;
                width: calc(100% - 200px);
            }

            .nav-btn {
                padding: 10px 12px;
                font-size: 0.85rem;
                gap: 8px;
            }

            .nav-btn i {
                font-size: 1rem;
            }

            h1.gradient-title {
                font-size: 1.8rem;
            }

            .card-grid {
                grid-template-columns: 1fr;
            }
        }

        .sidebar::-webkit-scrollbar,
        #chatBox::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-track,
        #chatBox::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        .sidebar::-webkit-scrollbar-thumb,
        #chatBox::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .sidebar::-webkit-scrollbar-thumb:hover,
        #chatBox::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <div id="bg"></div>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h2 class="text-2xl font-extrabold mb-8 text-white text-center">SGU <span class="text-purple-400">Rei Luhuna</span></h2>
        
        <div class="mb-6">
            <p class="text-xs text-gray-500 uppercase tracking-wider mb-3">Módulos Académicos</p>
            <button class="nav-btn active" onclick="nav('home',this)"><i class="fas fa-home"></i> <span>Dashboard</span></button>
            <button class="nav-btn" onclick="nav('academic',this)"><i class="fas fa-book"></i> <span>Académico</span></button>
            <button class="nav-btn" onclick="nav('grades',this)"><i class="fas fa-chart-bar"></i> <span>Notas</span></button>
            <button class="nav-btn" onclick="nav('enrollment',this)"><i class="fas fa-clipboard-list"></i> <span>Matrículas</span></button>
        </div>

        <div class="mb-6">
            <p class="text-xs text-gray-500 uppercase tracking-wider mb-3">Módulos Financeiros</p>
            <button class="nav-btn" onclick="nav('financial',this)"><i class="fas fa-credit-card"></i> <span>Financeiro</span></button>
            <button class="nav-btn" onclick="nav('invoices',this)"><i class="fas fa-receipt"></i> <span>Faturas</span></button>
            <button class="nav-btn" onclick="nav('scholarships',this)"><i class="fas fa-graduation-cap"></i> <span>Bolsas</span></button>
        </div>

        <div class="mb-6">
            <p class="text-xs text-gray-500 uppercase tracking-wider mb-3">Gestão</p>
            <button class="nav-btn" onclick="nav('staff',this)"><i class="fas fa-users"></i> <span>Docentes</span></button>
            <button class="nav-btn" onclick="nav('reports',this)"><i class="fas fa-chart-line"></i> <span>Relatórios</span></button>
            <button class="nav-btn" onclick="nav('library',this)"><i class="fas fa-book-open"></i> <span>Biblioteca</span></button>
            <button class="nav-btn" onclick="nav('communications',this)"><i class="fas fa-envelope"></i> <span>Comunicações</span></button>
        </div>

        <div class="mt-auto text-xs text-gray-500 text-center pt-4 border-t border-gray-700">
            Instituto Superior Privado Rei Luhuna<br/>
            <span class="font-semibold text-gray-400">Luanda, Angola</span>
        </div>
    </div>

    <!-- MAIN CONTAINER -->
    <div class="main-container">
        <!-- MAIN CONTENT -->
        <div class="flex-1 p-6 md:p-10 overflow-y-auto relative z-10">
            <div id="content"></div>
        </div>
    </div>

    <!-- CHAT FLOATING BUTTON -->
    <button id="chatButton" onclick="toggleChat()" title="Assistente Virtual">
        <i class="fas fa-comments"></i>
    </button>

    <!-- CHAT WINDOW -->
    <div id="chatWindow">
        <div class="chat-header">
            <h3>Assistente Virtual</h3>
            <button class="chat-close" onclick="toggleChat()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div id="chatBox"></div>
        <div class="chat-input-container">
            <input id="chatInput" placeholder="Escreva a sua pergunta..." onkeydown="if(event.key==='Enter') sendMsg()">
            <button class="chat-send-btn" onclick="sendMsg()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        // BACKGROUND ROTATIVO
        const imgs = [
            "https://images.unsplash.com/photo-1523580494863-6f3031224c94?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3",
            "https://images.unsplash.com/photo-1427504494785-cdafb3d3b798?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3",
            "https://images.unsplash.com/photo-1516534775068-bb57b6439066?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3"
        ];
        let i = 0;
        function bg() {
            document.getElementById("bg").style.background = `linear-gradient(rgba(0,0,0,0.75),rgba(0,0,0,0.9)),url(${imgs[i]}) center/cover fixed`;
            i = (i + 1) % imgs.length;
        }
        setInterval(bg, 7000);
        bg();

        // DATABASE DUMMY
        let DB = JSON.parse(localStorage.getItem("sgu_rei_luhuna") || `{
            "user": {
                "name": "João Silva",
                "role": "Estudante",
                "matricula": "RL2024001",
                "email": "joao.silva@reilu.ao",
                "phone": "+244923456789"
            },
            "students": [
                {"name": "João Silva", "matricula": "RL2024001", "course": "Engenharia Informática", "status": "Ativo", "financial": "Regular"},
                {"name": "Maria Santos", "matricula": "RL2024002", "course": "Administração", "status": "Ativo", "financial": "Atrasado"},
                {"name": "Pedro Neves", "matricula": "RL2024003", "course": "Direito", "status": "Inativo", "financial": "Regular"}
            ],
            "grades": [
                {"subject": "Programação I", "grade": 18, "status": "Aprovado"},
                {"subject": "Matemática Discreta", "grade": 15, "status": "Aprovado"},
                {"subject": "Estrutura de Dados", "grade": 19, "status": "Aprovado"}
            ],
            "financial": [
                {"month": "Janeiro 2025", "amount": 45000, "status": "Pago", "dueDate": "2025-01-15"},
                {"month": "Fevereiro 2025", "amount": 45000, "status": "Pendente", "dueDate": "2025-02-15"},
                {"month": "Março 2025", "amount": 45000, "status": "Vencido", "dueDate": "2025-03-15"}
            ],
            "staff": [
                {"name": "Prof. Dr. Kapenda Mário", "title": "Reitor", "department": "Reitoria", "email": "kapenda@reilu.ao", "phone": "+244923000001"},
                {"name": "Eng. Alberto Marcos", "title": "Coordenador de Engenharia", "department": "Engenharia", "email": "alberto@reilu.ao", "phone": "+244923000002"},
                {"name": "Dra. Jenny Baptista", "title": "Coordenadora de Administração", "department": "Administração", "email": "jenny@reilu.ao", "phone": "+244923000003"}
            ],
            "library": [
                {"title": "Introdução à Programação", "author": "Bjarne Stroustrup", "isbn": "978-0134685991", "status": "Disponível"},
                {"title": "Estrutura de Dados", "author": "Mark Allen Weiss", "isbn": "978-0132576277", "status": "Emprestado"},
                {"title": "Algoritmos", "author": "Robert Sedgewick", "isbn": "978-0321573513", "status": "Disponível"}
            ],
            "announcements": [
                {"title": "Calendário Académico 2025", "date": "2025-01-10", "content": "O calendário académico para o ano 2025 foi publicado. Consulte o portal para mais detalhes."},
                {"title": "Inscrição em Disciplinas", "date": "2025-01-15", "content": "Período de inscrição em disciplinas aberto até 31 de janeiro."},
                {"title": "Aviso Importante", "date": "2025-01-20", "content": "Lembrete: Propinas devem ser pagas até o dia 15 de cada mês."}
            ]
        }`);

        function save() {
            localStorage.setItem("sgu_rei_luhuna", JSON.stringify(DB));
        }

        function toggleChat() {
            const chatWindow = document.getElementById('chatWindow');
            chatWindow.classList.toggle('active');
        }

        function nav(page, el) {
            document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
            el.classList.add("active");
            const contentDiv = document.getElementById("content");
            contentDiv.classList.remove('fade-in');
            void contentDiv.offsetWidth;
            contentDiv.classList.add('fade-in');

            switch (page) {
                case "home": renderHome(); break;
                case "academic": renderAcademic(); break;
                case "grades": renderGrades(); break;
                case "enrollment": renderEnrollment(); break;
                case "financial": renderFinancial(); break;
                case "invoices": renderInvoices(); break;
                case "scholarships": renderScholarships(); break;
                case "staff": renderStaff(); break;
                case "reports": renderReports(); break;
                case "library": renderLibrary(); break;
                case "communications": renderCommunications(); break;
            }
        }

        // RENDER FUNCTIONS
        function renderHome() {
            content.innerHTML = `
                <div class="fade-in">
                    <h1 class="gradient-title mb-4">Bem-vindo ao SGU Rei Luhuna</h1>
                    <p class="text-gray-300 text-xl mb-8">Sistema de Gestão Universitária - Instituto Superior Privado Rei Luhuna</p>
                    
                    <div class="glass mb-6 p-6">
                        <p class="text-lg mb-2"><strong>Utilizador:</strong> ${DB.user.name}</p>
                        <p class="text-gray-300"><strong>Matrícula:</strong> ${DB.user.matricula}</p>
                        <p class="text-gray-300"><strong>Curso:</strong> Engenharia Informática</p>
                    </div>

                    <h2 class="text-2xl font-bold mb-4 text-purple-300">Resumo Académico</h2>
                    <div class="card-grid mb-8">
                        <div class="glass flex items-center gap-4">
                            <i class="fas fa-book text-4xl text-purple-400"></i>
                            <div>
                                <b class="text-gray-300">Disciplinas Inscritas</b>
                                <p class="text-3xl font-bold text-white">6</p>
                            </div>
                        </div>
                        <div class="glass flex items-center gap-4">
                            <i class="fas fa-star text-4xl text-yellow-400"></i>
                            <div>
                                <b class="text-gray-300">Média Geral</b>
                                <p class="text-3xl font-bold text-white">17.3</p>
                            </div>
                        </div>
                        <div class="glass flex items-center gap-4">
                            <i class="fas fa-credit-card text-4xl text-green-400"></i>
                            <div>
                                <b class="text-gray-300">Situação Financeira</b>
                                <p class="text-3xl font-bold text-white">Regular</p>
                            </div>
                        </div>
                    </div>

                    <h2 class="text-2xl font-bold mb-4 text-purple-300">Últimos Anúncios</h2>
                    <div class="space-y-4">
                        ${DB.announcements.map(a => `
                            <div class="glass p-5">
                                <h3 class="text-lg font-bold text-purple-300 mb-2">${a.title}</h3>
                                <p class="text-gray-400 text-sm mb-2">${a.date}</p>
                                <p class="text-gray-300">${a.content}</p>
                            </div>
                        `).join("")}
                    </div>
                </div>`;
        }

        function renderAcademic() {
            content.innerHTML = `
                <div class="fade-in">
                    <h2 class="text-4xl font-extrabold text-purple-400 mb-6">Gestão Académica</h2>
                    <p class="text-gray-400 mb-6">Consulte informações académicas, plano curricular e histórico escolar.</p>
                    
                    <div class="glass p-6 mb-6">
                        <h3 class="text-2xl font-bold mb-4 text-purple-300">Informações do Curso</h3>
                        <div class="grid md:grid-cols-2 gap-4">
                            <div>
                                <p class="text-gray-400">Curso: <span class="text-white font-semibold">Engenharia Informática</span></p>
                                <p class="text-gray-400">Duração: <span class="text-white font-semibold">4 Anos</span></p>
                                <p class="text-gray-400">Semestre Atual: <span class="text-white font-semibold">3º Semestre</span></p>
                            </div>
                            <div>
                                <p class="text-gray-400">Carga Horária: <span class="text-white font-semibold">2400 Horas</span></p>
                                <p class="text-gray-400">Créditos ECTS: <span class="text-white font-semibold">240</span></p>
                                <p class="text-gray-400">Coordenador: <span class="text-white font-semibold">Eng. Alberto Marcos</span></p>
                            </div>
                        </div>
                    </div>

                    <h3 class="text-2xl font-bold mb-4 text-purple-300">Disciplinas do Semestre Atual</h3>
                    <div class="card-grid">
                        ${["Programação II", "Estrutura de Dados", "Sistemas Operacionais", "Redes de Computadores", "Engenharia de Software", "Bases de Dados"].map(d => `
                            <div class="glass p-5 text-center">
                                <i class="fas fa-book text-3xl text-purple-400 mb-3"></i>
                                <p class="text-lg font-bold text-white">${d}</p>
                                <p class="text-gray-400 text-sm mt-2">Inscrição Confirmada</p>
                                <span class="inline-block mt-3 status-badge status-active">Ativo</span>
                            </div>
                        `).join("")}
                    </div>
                </div>`;
        }

        function renderGrades() {
            content.innerHTML = `
                <div class="fade-in">
                    <h2 class="text-4xl font-extrabold text-yellow-400 mb-6">Notas e Desempenho</h2>
                    <p class="text-gray-400 mb-6">Consulte as suas notas e histórico académico.</p>
                    
                    <div class="glass p-6 mb-6">
                        <h3 class="text-2xl font-bold mb-4 text-yellow-300">Estatísticas Gerais</h3>
                        <div class="grid md:grid-cols-3 gap-4">

        // CHATBOT
        function sendMsg() {
            let v = document.getElementById('chatInput').value.toLowerCase();
            if (!v) return;

            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML += `<div style="text-align: right; color: #a78bfa; margin-bottom: 8px;">Você: ${v}</div>`;
            document.getElementById('chatInput').value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            let r = "Desculpe, não entendi. Posso ajudar com informações sobre académico, financeiro, biblioteca ou outras funcionalidades.";

            if (v.includes("olá") || v.includes("oi")) {
                r = "Olá! Bem-vindo ao SGU Rei Luhuna. Como posso ajudar?";
            } else if (v.includes("notas") || v.includes("grades")) {
                r = "Para consultar as suas notas, clique em 'Notas' no menu lateral.";
            } else if (v.includes("propina") || v.includes("financeiro")) {
                r = "Para informações financeiras, aceda à secção 'Financeiro'.";
            } else if (v.includes("disciplina") || v.includes("inscrição")) {
                r = "Para gerir inscrições em disciplinas, visite 'Matrículas e Inscrições'.";
            } else if (v.includes("biblioteca") || v.includes("livro")) {
                r = "A biblioteca digital está disponível na secção 'Biblioteca'.";
            } else if (v.includes("docente") || v.includes("professor")) {
                r = "Conheça o corpo docente na secção 'Corpo Docente'.";
            } else if (v.includes("bolsa") || v.includes("desconto")) {
                r = "Informações sobre bolsas estão em 'Bolsas e Descontos'.";
            } else if (v.includes("fatura") || v.includes("recibo")) {
                r = "Gere faturas e recibos na secção 'Faturas e Recibos'.";
            }

            setTimeout(() => {
                chatBox.innerHTML += `<div style="color: #a78bfa; margin-bottom: 8px;">Assistente: ${r}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 800);
        }
